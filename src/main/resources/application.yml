spring:
  application:
    name: activation-service

  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 3000

  jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC

  flyway:
        enabled: true
        locations: classpath:db/migration

    # Segurança OAuth2 Resource Server.
    # Em produção, defina a variável OAUTH2_ISSUER_URI (ou OAUTH2_JWK_SET_URI) para que o Spring
    # valide tokens RS256 via JWKS do Authorization Server. Quando ausente (dev/teste), o
    # LocalJwtConfig fornece um decoder HMAC baseado em security.dev.jwt.hmac-secret.
    # As linhas abaixo ficam comentadas para não criar propriedades vazias:
    # security:
    #   oauth2:
    #     resourceserver:
    #       jwt:
    #         issuer-uri: ${OAUTH2_ISSUER_URI}

# Configurações da integração com o provedor externo de ativação
provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8081}
    activate-path: /provider/v1/activate
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
    api-key: ${PROVIDER_API_KEY:local-dev-key}

# Configurações do processamento assíncrono / retry
activation:
    worker:
        enabled: ${WORKER_ENABLED:true}
        batch-size: 20
        poll-interval: 2000 # ms entre ciclos do worker de outbox
        max-attempts: 5
        base-backoff-seconds: 5 # backoff exponencial: base * 2^(attempt-1)
        max-backoff-seconds: 300
    reconciliation:
        stuck-after: 10m # tempo após o qual um PROCESSING é considerado preso
        interval: 60000 # ms entre execuções do job de reconciliação
    request:
        max-field-length: 100

# Swagger UI em /swagger-ui.html; especificação OpenAPI em /v3/api-docs
springdoc:
    swagger-ui:
        path: /swagger-ui.html
        operations-sorter: method

server:
    shutdown: graceful
    tomcat:
        max-swallow-size: 2MB
        max-http-form-post-size: 256KB

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            probes:
                enabled: true
            show-details: when_authorized
    metrics:
        tags:
            application: ${spring.application.name}

logging:
    pattern:
        # Inclui o traceId (MDC) em cada linha de log para correlação
        level: "%5p [${spring.application.name},traceId=%X{traceId:-}]"
