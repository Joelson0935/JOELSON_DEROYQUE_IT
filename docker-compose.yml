# Sobe a aplicação + banco + mock do provedor com um único comando:
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  # Mock do provedor externo de ativação (responde 200 em POST /provider/v1/activate).
  provider-mock:
    image: wiremock/wiremock:3.9.2
    command: ["--port", "8081", "--verbose"]
    ports:
      - "8081:8081"
    volumes:
      - ./wiremock:/home/wiremock

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      provider-mock:
        condition: service_started
    environment:
      # Banco
      DB_URL: jdbc:postgresql://db:5432/activation
      DB_USERNAME: activation
      DB_PASSWORD: activation
      # Provedor externo (aponta para o mock)
      PROVIDER_BASE_URL: http://provider-mock:8081
      PROVIDER_API_KEY: local-dev-key
      # Segredo HMAC para emitir/validar tokens sem Authorization Server (apenas demo/dev).
      # Em produção, use o profile 'prod' com OAUTH2_ISSUER_URI em vez deste segredo.
      SECURITY_DEV_JWT_HMAC_SECRET: compose-dev-secret-change-me-please-32bytes!!
      # Perfil default (usa Postgres via DB_URL). Não usamos 'local' aqui para não cair no H2.
    ports:
      - "8080:8080"

volumes:
  db-data:
